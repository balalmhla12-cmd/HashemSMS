plugins { id 'com.android.application' }

android {
    namespace 'com.hashem.sms'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hashem.sms'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}


tasks.register('prepareAlmaraiFonts') {
    outputs.dir(layout.projectDirectory.dir('src/main/res/font'))
    doLast {
        def fontDir = file('src/main/res/font')
        fontDir.mkdirs()
        def fonts = [
            'almarai_regular.ttf': 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/almarai/Almarai-Regular.ttf',
            'almarai_bold.ttf': 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/almarai/Almarai-Bold.ttf',
            'almarai_extrabold.ttf': 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/almarai/Almarai-ExtraBold.ttf'
        ]
        fonts.each { name, address ->
            def target = new File(fontDir, name)
            if (!target.exists() || target.length() < 10000) {
                new URL(address).withInputStream { stream -> target.withOutputStream { out -> out << stream } }
            }
            if (target.length() < 10000) throw new GradleException('Almarai font download failed: ' + name)
        }
    }
}
tasks.named('preBuild').configure { dependsOn('prepareAlmaraiFonts') }
