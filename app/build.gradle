plugins { id 'com.android.application' }

def shortGitCommit = providers.exec { commandLine 'git', 'rev-parse', '--short=7', 'HEAD' }.standardOutput.asText.get().trim()

android {
    buildFeatures { buildConfig true }
    namespace 'com.hashem.sms'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hashem.sms'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'GIT_COMMIT', '"' + shortGitCommit + '"'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}


