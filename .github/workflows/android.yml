name: Build HashemSMS APK

on:
  push:
    branches: [main, phase1-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run baseline Android lint
        env:
          BASELINE_SHA: a5854817b880921f486f39385d9480239b470acd
        run: |
          git worktree add --detach "$RUNNER_TEMP/hashemsms-lint-baseline" "$BASELINE_SHA"
          chmod +x "$RUNNER_TEMP/hashemsms-lint-baseline/gradlew"
          (cd "$RUNNER_TEMP/hashemsms-lint-baseline" && ./gradlew --no-daemon lintDebug)
          cp "$RUNNER_TEMP/hashemsms-lint-baseline/app/build/reports/lint-results-debug.xml" "$RUNNER_TEMP/lint-baseline.xml"
          cp "$RUNNER_TEMP/hashemsms-lint-baseline/app/build/reports/lint-results-debug.html" "$RUNNER_TEMP/lint-baseline.html"

      - name: Reject hard-coded Java color constructors
        run: python3 scripts/check_no_hardcoded_colors.py

      - name: Check WCAG contrast for light and dark palettes
        run: python3 tools/check_color_contrast.py

      - name: Run database migration and lifecycle unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          printf '%s\n' "$BADGING" | grep -q "^package: name='com.hashem.sms'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='4'"
          MIN_SDK="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk "$APK")"
          printf 'minSdkVersion=%s\n' "$MIN_SDK"
          test "$MIN_SDK" = "26"
          printf '%s\n' "$BADGING" | grep -q "^native-code:"
      - name: Print APK SHA-256 and size
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK"
          stat --printf='APK_SIZE_BYTES=%s\n' "$APK"
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashemSMS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Print Android lint warnings (diagnostic only)
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from collections import Counter
          def rows(p):
              if not os.path.exists(p): return None
              out = []
              for i in ET.parse(p).getroot().findall('.//issue'):
                  if (i.get('severity') or '').lower() != 'warning': continue
                  loc = i.find('location')
                  f = (loc.get('file') if loc is not None else '') or ''
                  ln = (loc.get('line') if loc is not None else '') or ''
                  out.append((i.get('id') or '', f.split('/app/')[-1], ln, (i.get('message') or '').splitlines()[0]))
              return out
          base = rows(os.path.join(os.environ['RUNNER_TEMP'], 'lint-baseline.xml'))
          cur = rows('app/build/reports/lint-results-debug.xml')
          for name, r in (('BASELINE', base), ('CURRENT', cur)):
              print('=== ' + name + ' ===')
              if r is None:
                  print('missing')
                  continue
              for x in sorted(r): print(' | '.join(x))
          if base is not None and cur is not None:
              d = Counter(x[0] for x in cur) - Counter(x[0] for x in base)
              print('=== EXTRA IDS (current minus baseline) ===')
              for k, v in d.items(): print(k, v)
          PY
      - name: Compare lint baseline and write summary
        if: always()
        run: |
          python3 - <<'PY'
          import collections, os, sys, xml.etree.ElementTree as ET
          baseline = os.path.join(os.environ["RUNNER_TEMP"], "lint-baseline.xml")
          current = "app/build/reports/lint-results-debug.xml"
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          def read(path):
              issues = ET.parse(path).getroot().findall(".//issue")
              counts = collections.Counter((i.get("severity") or "Unknown").lower() for i in issues)
              warning_ids = collections.Counter(i.get("id") or "Unknown" for i in issues if (i.get("severity") or "").lower() == "warning")
              messages = {}
              for i in issues:
                  if (i.get("severity") or "").lower() == "warning":
                      messages.setdefault(i.get("id") or "Unknown", (i.get("message") or "").splitlines()[0])
              return counts, warning_ids, messages
          if not os.path.exists(baseline) or not os.path.exists(current):
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## Android Lint\n\nتعذر حساب المقارنة لأن تقرير XML الأساسي أو الحالي غير موجود.\n")
              sys.exit(1)
          b, bk, bm = read(baseline); c, ck, cm = read(current)
          bw, be = b["warning"], b["error"] + b["fatal"]
          cw, ce = c["warning"], c["error"] + c["fatal"]
          with open(summary, "a", encoding="utf-8") as out:
              out.write("## Android Lint — baseline comparison\n\n")
              out.write(f"- Baseline commit: `a5854817b880921f486f39385d9480239b470acd`\n")
              out.write(f"- Baseline warnings: **{bw}**; baseline errors/fatals: **{be}**\n")
              out.write(f"- Current warnings: **{cw}**; current errors/fatals: **{ce}**\n")
              out.write("- Maximum allowed current warnings: **14**\n")
              out.write("- Top 3 baseline warning categories:\n")
              for issue_id, count in bk.most_common(3):
                  out.write(f"  - `{issue_id}` ({count}): {bm.get(issue_id, '')}\n")
              if cw > 14 or cw > bw or ce > be:
                  out.write("\n**FAIL:** lint exceeds the 14-warning cap or the baseline.\n")
              else:
                  out.write("\n**PASS:** current warnings are <= 14 and warning/error counts do not exceed the baseline.\n")
          print(f"BASELINE_LINT_WARNINGS={bw} BASELINE_LINT_ERRORS={be}")
          print("BASELINE_LINT_WARNING_TYPES=" + ", ".join(f"{name}:{count}" for name, count in bk.most_common(3)))
          print(f"CURRENT_LINT_WARNINGS={cw} CURRENT_LINT_ERRORS={ce}")
          print("MAX_ALLOWED_LINT_WARNINGS=14")
          if cw > 14 or cw > bw or ce > be: sys.exit(1)
          PY

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HashemSMS-android-lint-reports
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload unit test XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HashemSMS-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

  publish_release:
    name: Publish private test pre-release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/phase1-ui'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: HashemSMS-debug-apk
          path: release-apk

      - name: Publish APK pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hashemsms-test-${{ github.run_number }}
          name: HashemSMS test build ${{ github.run_number }}
          target_commitish: phase1-ui
          prerelease: true
          draft: false
          files: release-apk/app-debug.apk
          fail_on_unmatched_files: true
