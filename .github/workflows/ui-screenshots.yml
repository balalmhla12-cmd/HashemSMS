name: HashemSMS UI screenshots

on:
  push:
    branches: [phase1-ui]
  workflow_dispatch:

# Final visual verification is requested by the [screenshots] commit marker.

permissions:
  contents: read

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]') || contains(github.event.head_commit.message, '[batch-complete]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout phase1-ui
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM acceleration on hosted runner
        run: |
          echo "Checking /dev/kvm availability"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run UI screenshot tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -eu
            chmod +x gradlew
            ./gradlew --no-daemon installDebug
            adb shell cmd role add-role-holder --user 0 android.app.role.SMS com.hashem.sms || true
            adb shell pm grant com.hashem.sms android.permission.SEND_SMS
            adb shell pm grant com.hashem.sms android.permission.RECEIVE_SMS
            adb shell pm grant com.hashem.sms android.permission.READ_SMS
            adb shell pm grant com.hashem.sms android.permission.READ_CONTACTS
            mkdir -p ui-screenshots
            ./gradlew --no-daemon installDebug installDebugAndroidTest
            adb shell am instrument -w -r com.hashem.sms.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            grep -q "INSTRUMENTATION_CODE: -1" instrument.log
            grep -q "^OK (1 test)" instrument.log
            adb exec-out run-as com.hashem.sms sh -c 'cd files && tar -cf - HashemSMS-Screenshots' > ui-screenshots.tar
            test -s ui-screenshots.tar
            tar -xf ui-screenshots.tar -C ui-screenshots
            rm -f ui-screenshots.tar

      - name: Verify all sixteen screenshots exist
        run: |
          set -eu
          dir=ui-screenshots/HashemSMS-Screenshots
          test "$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 16
          for theme in light dark; do
            for screen in 01-home 02-conversation 03-composer 04-bulk 05-sidebar 06-bulk-picker 07-bulk-review 08-bulk-track; do
              test -s "$dir/$screen-$theme.png"
            done
          done

      - name: Upload light and dark screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HashemSMS-UI-Screenshots-${{ github.sha }}
          path: ui-screenshots/HashemSMS-Screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Print bulk screenshot as base64 in the job log (retrieval channel)
        if: always()
        run: |
          echo "BULK_B64_BEGIN"
          base64 -w0 ui-screenshots/HashemSMS-Screenshots/08-bulk-track-light.png | fold -w 2000 || true
          echo
          echo "BULK_B64_END"
